<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Food Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="static/css/style.css" />
</head>
<body>

  <main class="auth-page">
    <div class="auth-card">
      <p class="eyebrow">Food Planner</p>
      <h1>Create your account</h1>
      <p class="auth-card__subtitle">Start planning meals in minutes.</p>

      <form id="register-form" novalidate>
        <div class="field">
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" name="fullName" autocomplete="name" required />
          <span class="field__error"></span>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
          <span class="field__error"></span>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required />
          <span class="field__error"></span>
          <small class="field__hint">At least 6 characters.</small>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required />
          <span class="field__error"></span>
        </div>

        <button type="submit" class="btn btn--primary btn--block">Create Account</button>
      </form>

      <p class="auth-card__footer">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="static/js/supabaseClient.js"></script>
  <script src="static/js/notifications.js"></script>
  <script src="static/js/auth.js"></script>
  <script>
    redirectIfAuthed();

    document
      .getElementById('register-form')
      .addEventListener('submit', handleRegisterSubmit);
  </script>
</body>
</html>
