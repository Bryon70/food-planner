<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Food Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="static/css/style.css" />
</head>
<body>

  <div class="app-shell">
    <aside class="sidenav">
      <p class="sidenav__brand">Food Planner</p>
      <nav>
        <a href="dashboard.html" class="sidenav__link">Dashboard</a>
        <a href="planner.html" class="sidenav__link">Meal Planner</a>
        <a href="recipes.html" class="sidenav__link">Recipes</a>
        <a href="favorites.html" class="sidenav__link">Favorites</a>
        <a href="shopping-list.html" class="sidenav__link">Shopping List</a>
        <a href="profile.html" class="sidenav__link">Profile</a>
      </nav>
      <div class="sidenav__footer">
        <p data-user-name></p>
        <a href="#" data-logout>Logout</a>
      </div>
    </aside>

    <main class="app-main">
      <header class="app-main__header">
        <h1>Profile</h1>
      </header>

      <section class="panel panel--narrow">
        <form id="profile-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" disabled />
            <small class="field__hint">Contact support to change your email.</small>
          </div>

          <div class="field">
            <label for="full_name">Full name</label>
            <input type="text" id="full_name" name="full_name" required />
            <span class="field__error"></span>
          </div>

          <div class="field">
            <label for="avatar_url">Avatar URL</label>
            <input type="url" id="avatar_url" name="avatar_url" placeholder="https://…" />
            <span class="field__error"></span>
          </div>

          <div class="field">
            <label for="bio">Bio</label>
            <textarea id="bio" name="bio" rows="3" maxlength="300"></textarea>
          </div>

          <button type="submit" class="btn btn--primary">Save Changes</button>
        </form>
      </section>

      <section class="panel panel--narrow panel--danger">
        <h2>Change Password</h2>
        <form id="password-form" novalidate>
          <div class="field">
            <label for="new_password">New password</label>
            <input type="password" id="new_password" name="new_password" autocomplete="new-password" required />
            <span class="field__error"></span>
          </div>
          <div class="field">
            <label for="confirm_new_password">Confirm new password</label>
            <input type="password" id="confirm_new_password" name="confirm_new_password" autocomplete="new-password" required />
            <span class="field__error"></span>
          </div>
          <button type="submit" class="btn btn--secondary">Update Password</button>
        </form>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="static/js/supabaseClient.js"></script>
  <script src="static/js/notifications.js"></script>
  <script src="static/js/auth.js"></script>
  <script src="static/js/profile.js"></script>
</body>
</html>
