<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meal Planner — Food Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="static/css/style.css" />
</head>
<body>

  <div class="app-shell">
    <aside class="sidenav">
      <p class="sidenav__brand">Food Planner</p>
      <nav>
        <a href="dashboard.html" class="sidenav__link">Dashboard</a>
        <a href="planner.html" class="sidenav__link">Meal Planner</a>
        <a href="recipes.html" class="sidenav__link">Recipes</a>
        <a href="favorites.html" class="sidenav__link">Favorites</a>
        <a href="shopping-list.html" class="sidenav__link">Shopping List</a>
        <a href="profile.html" class="sidenav__link">Profile</a>
      </nav>
      <div class="sidenav__footer">
        <p data-user-name></p>
        <a href="#" data-logout>Logout</a>
      </div>
    </aside>

    <main class="app-main">
      <header class="app-main__header">
        <h1>Meal Planner</h1>
        <div class="week-nav">
          <button class="btn btn--ghost" id="prev-week-btn">&larr; Prev</button>
          <span id="week-range-label"></span>
          <button class="btn btn--ghost" id="next-week-btn">Next &rarr;</button>
          <button class="btn btn--ghost btn--small" id="this-week-btn">This week</button>
        </div>
      </header>

      <div class="planner-grid" id="planner-grid">
        <!-- built entirely by planner.js -->
      </div>
    </main>
  </div>

  <!-- Recipe picker modal -->
  <div class="modal-overlay" id="picker-modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <h2>Add a meal</h2>
      <p class="modal-card__meta" id="picker-slot-label"></p>
      <input type="search" id="picker-search" placeholder="Search your recipes…" />
      <div id="picker-results" class="picker-results"></div>
      <div class="modal-card__actions">
        <button type="button" class="btn btn--ghost" id="picker-cancel-btn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="static/js/supabaseClient.js"></script>
  <script src="static/js/notifications.js"></script>
  <script src="static/js/auth.js"></script>
  <script src="static/js/planner.js"></script>
</body>
</html>
