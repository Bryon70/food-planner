<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipes — Food Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="static/css/style.css" />
</head>
<body>

  <div class="app-shell">
    <aside class="sidenav">
      <p class="sidenav__brand">Food Planner</p>
      <nav>
        <a href="dashboard.html" class="sidenav__link">Dashboard</a>
        <a href="planner.html" class="sidenav__link">Meal Planner</a>
        <a href="recipes.html" class="sidenav__link">Recipes</a>
        <a href="favorites.html" class="sidenav__link">Favorites</a>
        <a href="shopping-list.html" class="sidenav__link">Shopping List</a>
        <a href="profile.html" class="sidenav__link">Profile</a>
      </nav>
      <div class="sidenav__footer">
        <p data-user-name></p>
        <a href="#" data-logout>Logout</a>
      </div>
    </aside>

    <main class="app-main">
      <header class="app-main__header">
        <h1>Recipes</h1>
        <button class="btn btn--primary" id="new-recipe-btn">+ New Recipe</button>
      </header>

      <section class="toolbar">
        <input type="search" id="search-input" placeholder="Search recipes…" />

        <select id="category-filter">
          <option value="">All categories</option>
          <option value="breakfast">Breakfast</option>
          <option value="lunch">Lunch</option>
          <option value="dinner">Dinner</option>
          <option value="dessert">Dessert</option>
          <option value="snack">Snack</option>
          <option value="other">Other</option>
        </select>

        <select id="difficulty-filter">
          <option value="">Any difficulty</option>
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>

        <select id="sort-select">
          <option value="created_at-desc">Newest first</option>
          <option value="created_at-asc">Oldest first</option>
          <option value="name-asc">Name A–Z</option>
          <option value="prep_time_minutes-asc">Prep time (low–high)</option>
        </select>

        <label class="checkbox-label">
          <input type="checkbox" id="favorites-only" />
          Favorites only
        </label>
      </section>

      <section id="recipe-grid" class="recipe-grid">
        <!-- recipe cards injected by recipes.js -->
      </section>
    </main>
  </div>

  <!-- Recipe create/edit modal -->
  <div class="modal-overlay" id="recipe-modal" hidden>
    <div class="modal-card modal-card--large" role="dialog" aria-modal="true">
      <h2 id="modal-title">New Recipe</h2>

      <form id="recipe-form" novalidate>
        <input type="hidden" name="id" />

        <div class="field">
          <label for="name">Recipe name</label>
          <input type="text" id="name" name="name" required />
          <span class="field__error"></span>
        </div>

        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="2"></textarea>
          <span class="field__error"></span>
        </div>

        <div class="field">
          <label for="image_url">Image URL</label>
          <input type="url" id="image_url" name="image_url" placeholder="https://…" />
          <span class="field__error"></span>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="prep_time_minutes">Prep time (min)</label>
            <input type="number" id="prep_time_minutes" name="prep_time_minutes" min="0" value="0" required />
          </div>
          <div class="field">
            <label for="cook_time_minutes">Cook time (min)</label>
            <input type="number" id="cook_time_minutes" name="cook_time_minutes" min="0" value="0" required />
          </div>
          <div class="field">
            <label for="servings">Servings</label>
            <input type="number" id="servings" name="servings" min="1" value="4" required />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="difficulty">Difficulty</label>
            <select id="difficulty" name="difficulty">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
            </select>
          </div>
          <div class="field">
            <label for="category">Category</label>
            <select id="category" name="category">
              <option value="breakfast">Breakfast</option>
              <option value="lunch">Lunch</option>
              <option value="dinner">Dinner</option>
              <option value="dessert">Dessert</option>
              <option value="snack">Snack</option>
              <option value="other" selected>Other</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="tags">Tags (comma separated)</label>
          <input type="text" id="tags" name="tags" placeholder="vegan, quick, spicy" />
        </div>

        <div class="field">
          <label>Ingredients</label>
          <div id="ingredient-rows"></div>
          <button type="button" class="btn btn--ghost btn--small" id="add-ingredient-btn">+ Add ingredient</button>
        </div>

        <div class="field">
          <label for="instructions">Instructions</label>
          <textarea id="instructions" name="instructions" rows="6" required></textarea>
          <span class="field__error"></span>
        </div>

        <div class="modal-card__actions">
          <button type="button" class="btn btn--ghost" id="cancel-recipe-btn">Cancel</button>
          <button type="submit" class="btn btn--primary">Save Recipe</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="static/js/supabaseClient.js"></script>
  <script src="static/js/notifications.js"></script>
  <script src="static/js/auth.js"></script>
  <script src="static/js/recipes.js"></script>
</body>
</html>
